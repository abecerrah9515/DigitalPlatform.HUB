<div class="p-6 bg-slate-50 min-h-[calc(100vh-64px)]">
  <div class="max-w-[1600px] mx-auto">

    <!-- Header -->
    <div class="mb-4 flex items-end justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">P&amp;L</h1>
        <p class="text-xs text-slate-500 mt-0.5">Vista financiera plan vs real — P26</p>
      </div>
      <button class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-medium hover:bg-emerald-700 transition shadow-sm flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        Exportar Excel
      </button>
    </div>

    <!-- Filtros -->
    @if (filtrosOpciones()) {
      <app-pnl-filters
        [options]="filtrosOpciones()!"
        (filtersChanged)="onFiltersChanged($event)"
      />
    }

    <!-- Tabla -->
    <div class="relative mt-2">
      @if (isLoading()) {
        <div class="absolute inset-0 bg-white/60 z-50 flex items-center justify-center rounded-xl backdrop-blur-sm">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        </div>
      }
      <app-pnl-table [data]="datos()" />
    </div>

  </div>
</div>
